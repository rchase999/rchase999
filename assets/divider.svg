<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset="50%"  stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#C084FC" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="9" width="1000" height="2" rx="1" fill="url(#dLine)" opacity=".55"/>

  <g filter="url(#dGlow)">
    <rect x="0" y="8.5" width="160" height="3" rx="1.5" fill="#22D3EE">
      <animate attributeName="x" values="-160;1000" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="10" r="3.5" fill="#ffffff">
      <animate attributeName="cx" values="-10;1010" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#818CF8">
    <circle cx="500" cy="10" r="2.5"><animate attributeName="r" values="2.5;4;2.5" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="10" r="1.6" opacity=".7"><animate attributeName="opacity" values=".7;.2;.7" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="10" r="1.6" opacity=".7"><animate attributeName="opacity" values=".2;.7;.2" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
