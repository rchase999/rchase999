<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480" role="img" aria-label="orbiting tech stack">
  <title>Tech stack in orbit</title>
  <defs>
    <radialGradient id="oCore" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="oText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#C084FC;#22D3EE" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#C084FC"><animate attributeName="stop-color" values="#C084FC;#22D3EE;#C084FC" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="oGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .s { font-family: ui-sans-serif,system-ui,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; }
      .chip { fill: #0F1626; stroke-width: 1.2; }
      .pulse { animation: pl 3s ease-in-out infinite; }
      @keyframes pl { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    </style>
  </defs>

  <rect width="520" height="480" rx="20" fill="#0D1117"/>
  <circle cx="260" cy="240" r="220" fill="url(#oCore)" opacity=".7"/>

  <g transform="translate(260,240)">
    <circle r="118" fill="none" stroke="#4169E1" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 7"/>
    <circle r="192" fill="none" stroke="#4169E1" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 7"/>

    <circle r="118" fill="none" stroke="url(#oRing)" stroke-width="2" stroke-dasharray="56 685" stroke-linecap="round" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="192" fill="none" stroke="url(#oRing)" stroke-width="2" stroke-dasharray="70 1136" stroke-linecap="round" opacity=".75">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- core -->
    <g filter="url(#oGlow)">
      <path d="M0 -46 L40 -23 L40 23 L0 46 L-40 23 L-40 -23 Z" fill="#0F1626" stroke="url(#oRing)" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="30s" repeatCount="indefinite"/>
    </g>
    <text class="s" x="0" y="-2" text-anchor="middle" font-size="15" font-weight="700" fill="url(#oText)">STACK</text>
    <text class="m" x="0" y="16" text-anchor="middle" font-size="10" letter-spacing="2" fill="#6E7B91">v2026</text>

    <!-- inner ring: 4 chips -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <g transform="rotate(0)"><g transform="translate(118,0)"><g transform="rotate(0)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="28s" repeatCount="indefinite"/>
        <rect class="chip" x="-52" y="-15" width="104" height="30" rx="15" stroke="#22D3EE"/>
        <circle cx="-36" cy="0" r="4" fill="#22D3EE"/>
        <text class="m" x="6" y="4" text-anchor="middle" font-size="12" fill="#22D3EE">TypeScript</text>
      </g></g></g></g>
      <g transform="rotate(90)"><g transform="translate(118,0)"><g transform="rotate(-90)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="28s" repeatCount="indefinite"/>
        <rect class="chip" x="-42" y="-15" width="84" height="30" rx="15" stroke="#818CF8"/>
        <circle cx="-28" cy="0" r="4" fill="#818CF8"/>
        <text class="m" x="6" y="4" text-anchor="middle" font-size="12" fill="#818CF8">Python</text>
      </g></g></g></g>
      <g transform="rotate(180)"><g transform="translate(118,0)"><g transform="rotate(-180)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="28s" repeatCount="indefinite"/>
        <rect class="chip" x="-34" y="-15" width="68" height="30" rx="15" stroke="#F0B072"/>
        <circle cx="-22" cy="0" r="4" fill="#F0B072"/>
        <text class="m" x="4" y="4" text-anchor="middle" font-size="12" fill="#F0B072">Java</text>
      </g></g></g></g>
      <g transform="rotate(270)"><g transform="translate(118,0)"><g transform="rotate(-270)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="28s" repeatCount="indefinite"/>
        <rect class="chip" x="-40" y="-15" width="80" height="30" rx="15" stroke="#C084FC"/>
        <circle cx="-26" cy="0" r="4" fill="#C084FC"/>
        <text class="m" x="6" y="4" text-anchor="middle" font-size="12" fill="#C084FC">React</text>
      </g></g></g></g>
    </g>

    <!-- outer ring: 5 chips -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="42s" repeatCount="indefinite"/>
      <g transform="rotate(0)"><g transform="translate(192,0)"><g transform="rotate(0)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
        <rect class="chip" x="-44" y="-14" width="88" height="28" rx="14" stroke="#12FF7F" stroke-opacity=".7"/>
        <text class="m" x="0" y="4" text-anchor="middle" font-size="11" fill="#7DFFC0">Node.js</text>
      </g></g></g></g>
      <g transform="rotate(72)"><g transform="translate(192,0)"><g transform="rotate(-72)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
        <rect class="chip" x="-52" y="-14" width="104" height="28" rx="14" stroke="#12FF7F" stroke-opacity=".7"/>
        <text class="m" x="0" y="4" text-anchor="middle" font-size="11" fill="#7DFFC0">Spring Boot</text>
      </g></g></g></g>
      <g transform="rotate(144)"><g transform="translate(192,0)"><g transform="rotate(-144)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
        <rect class="chip" x="-46" y="-14" width="92" height="28" rx="14" stroke="#22D3EE" stroke-opacity=".7"/>
        <text class="m" x="0" y="4" text-anchor="middle" font-size="11" fill="#9BE8FF">Tailwind</text>
      </g></g></g></g>
      <g transform="rotate(216)"><g transform="translate(192,0)"><g transform="rotate(-216)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
        <rect class="chip" x="-48" y="-14" width="96" height="28" rx="14" stroke="#818CF8" stroke-opacity=".7"/>
        <text class="m" x="0" y="4" text-anchor="middle" font-size="11" fill="#B4C0FF">MongoDB</text>
      </g></g></g></g>
      <g transform="rotate(288)"><g transform="translate(192,0)"><g transform="rotate(-288)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/>
        <rect class="chip" x="-40" y="-14" width="80" height="28" rx="14" stroke="#F472B6" stroke-opacity=".7"/>
        <text class="m" x="0" y="4" text-anchor="middle" font-size="11" fill="#FBA5CE">Docker</text>
      </g></g></g></g>
    </g>

    <g fill="#9BE8FF">
      <circle class="pulse" cx="-196" cy="-140" r="1.8"/>
      <circle class="pulse" cx="200"  cy="150"  r="1.6" style="animation-delay:1s"/>
      <circle class="pulse" cx="-180" cy="170"  r="1.4" style="animation-delay:2s"/>
      <circle class="pulse" cx="190"  cy="-160" r="2"   style="animation-delay:1.5s"/>
    </g>
  </g>
</svg>
