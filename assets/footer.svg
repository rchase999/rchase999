<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Thanks for stopping by">
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#070A11"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#4169E1" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00CED1" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00CED1" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#4169E1" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4169E1" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="fTxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#C084FC;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#C084FC"><animate attributeName="stop-color" values="#C084FC;#22D3EE;#C084FC" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="fClip"><rect width="1000" height="190" rx="18"/></clipPath>
    <style>
      .s { font-family: ui-sans-serif,system-ui,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif; }
      .m { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .tw { animation: tw 3.5s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    </style>
  </defs>

  <rect width="1000" height="190" rx="18" fill="url(#fBg)"/>

  <g clip-path="url(#fClip)">
    <g fill="#CFE9FF">
      <circle class="tw" cx="70"  cy="34" r="1.5"/>
      <circle class="tw" cx="180" cy="20" r="1.1" style="animation-delay:.6s"/>
      <circle class="tw" cx="300" cy="46" r="1.7" style="animation-delay:1.2s"/>
      <circle class="tw" cx="430" cy="18" r="1.2" style="animation-delay:1.8s"/>
      <circle class="tw" cx="600" cy="40" r="1.6" style="animation-delay:.3s"/>
      <circle class="tw" cx="740" cy="22" r="1.3" style="animation-delay:2.4s"/>
      <circle class="tw" cx="880" cy="44" r="1.8" style="animation-delay:1.5s"/>
      <circle class="tw" cx="950" cy="16" r="1.1" style="animation-delay:2.9s"/>
    </g>

    <text class="s" x="500" y="74" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="1" fill="url(#fTxt)">Thanks for stopping by!</text>
    <text class="m" x="500" y="98" text-anchor="middle" font-size="12" letter-spacing="3" fill="#6E7B91">STAR A REPO · SAY HI · BUILD SOMETHING</text>

    <g transform="translate(0,104)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="14s" repeatCount="indefinite"/>
        <path fill="url(#w1)" d="M0 30 C 62 6, 188 6, 250 30 S 438 54, 500 30 S 688 6, 750 30 S 938 54, 1000 30 S 1188 6, 1250 30 S 1438 54, 1500 30 L1500 90 L0 90 Z"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="11s" repeatCount="indefinite"/>
        <path fill="url(#w2)" d="M0 42 C 62 20, 188 20, 250 42 S 438 64, 500 42 S 688 20, 750 42 S 938 64, 1000 42 S 1188 20, 1250 42 S 1438 64, 1500 42 L1500 90 L0 90 Z"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="8s" repeatCount="indefinite"/>
        <path fill="url(#w3)" d="M0 56 C 62 40, 188 40, 250 56 S 438 72, 500 56 S 688 40, 750 56 S 938 72, 1000 56 S 1188 40, 1250 56 S 1438 72, 1500 56 L1500 90 L0 90 Z"/>
      </g>
    </g>

    <text class="m" x="500" y="180" text-anchor="middle" font-size="11" letter-spacing="2" fill="#E6EDF7" opacity=".9">github.com/rchase999</text>
  </g>
</svg>
